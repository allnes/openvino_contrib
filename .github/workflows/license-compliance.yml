name: License Compliance

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
      - "releases/**"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  LICENSE_EYE_CONFIG: .licenserc.yaml
  SCANCODE_POLICY_FILE: .github/scancode/policies.yml
  OPENVINO_COPYRIGHT_SCRIPT_URL: https://raw.githubusercontent.com/openvinotoolkit/openvino/HEAD/.github/scripts/check_copyright.py
  OPENVINO_COPYRIGHT_SCRIPT: scripts/license/openvino_check_copyright.py

jobs:
  license-eye:
    name: License-Eye headers and dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Temporary fork workaround: the allnes/openvino_contrib LFS store is
          # missing some referenced objects, so LFS checkout fails before scans
          # can run. Re-enable once the fork LFS objects are restored.
          lfs: false

      - name: Validate submodules
        run: python3 scripts/license/collect_license_inputs.py validate-submodules

      - name: Collect header inputs
        run: python3 scripts/license/collect_license_inputs.py openvino-header-files

      - name: Verify OpenVINO header policy mirror
        id: openvino-policy
        continue-on-error: true
        run: python3 scripts/license/compare_openvino_copyright.py

      - name: Check OpenVINO copyright headers
        id: openvino-headers
        continue-on-error: true
        run: python3 scripts/license/openvino_check_copyright.py license-inputs/openvino-header-files.txt

      - name: Upload OpenVINO copyright fix diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvino-copyright-fixes
          path: |
            copyright_fixes.diff
            copyright_issues.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Run SkyWalking Eyes header check
        id: license-eye-header
        continue-on-error: true
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          config: ${{ env.LICENSE_EYE_CONFIG }}
          token: ""

      - name: Run SkyWalking Eyes dependency check
        id: license-eye-dependency
        continue-on-error: true
        uses: apache/skywalking-eyes/dependency@v0.8.0
        with:
          config: ${{ env.LICENSE_EYE_CONFIG }}

      - name: Summarize License-Eye checks
        if: always()
        env:
          OPENVINO_POLICY_OUTCOME: ${{ steps.openvino-policy.outcome }}
          OPENVINO_HEADERS_OUTCOME: ${{ steps.openvino-headers.outcome }}
          LICENSE_EYE_HEADER_OUTCOME: ${{ steps.license-eye-header.outcome }}
          LICENSE_EYE_DEPENDENCY_OUTCOME: ${{ steps.license-eye-dependency.outcome }}
        run: python3 scripts/license/summarize_license_eye.py

  scancode-full-repo:
    name: ScanCode full repository
    runs-on: ubuntu-latest
    env:
      # Public VulnerableCode is used only for package/dependency vulnerability
      # matching. For private/proprietary repositories, set repository variable
      # VULNERABLECODE_URL to a self-hosted instance and prefer a self-hosted
      # runner. No source archive is uploaded to this URL.
      VULNERABLECODE_URL: ${{ vars.VULNERABLECODE_URL || 'https://public.vulnerablecode.io/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Temporary fork workaround: the allnes/openvino_contrib LFS store is
          # missing some referenced objects, so LFS checkout fails before scans
          # can run. Re-enable once the fork LFS objects are restored.
          lfs: false

      - name: Validate submodules
        run: python3 scripts/license/collect_license_inputs.py validate-submodules

      - name: Prepare full repository ScanCode input
        run: python3 scripts/license/collect_license_inputs.py full-repo

      - name: Install ScanCode.io wrapper with VulnerableCode settings
        run: python3 scripts/license/install_scanpipe_wrapper.py

      - name: Run ScanCode full repository scan
        uses: aboutcode-org/scancode-action@v0.1
        with:
          pipelines: scan_codebase,find_vulnerabilities
          inputs-path: scancode-inputs
          project-name: openvino-contrib-full-repo
          outputs-archive-name: scancode-full-repo
          output-formats: json xlsx spdx cyclonedx
          check-compliance: "true"
          compliance-fail-level: MISSING
          compliance-fail-on-vulnerabilities: "true"

      - name: Upload full repository ScanCode outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scancode-full-repo-outputs
          path: |
            .scancodeio/**/output/*
            scancode-inputs/policies.yml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize full repository ScanCode report
        if: always()
        run: python3 scripts/license/print_scancode_summary.py --search-root .scancodeio --title "ScanCode full repository report" --artifact-name "scancode-full-repo-outputs" --require-report

  scancode-thirdparty-focused:
    name: ScanCode third-party focused
    runs-on: ubuntu-latest
    env:
      # Public VulnerableCode is used only for package/dependency vulnerability
      # matching. For private/proprietary repositories, set repository variable
      # VULNERABLECODE_URL to a self-hosted instance and prefer a self-hosted
      # runner. No source archive is uploaded to this URL.
      VULNERABLECODE_URL: ${{ vars.VULNERABLECODE_URL || 'https://public.vulnerablecode.io/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Temporary fork workaround: the allnes/openvino_contrib LFS store is
          # missing some referenced objects, so LFS checkout fails before scans
          # can run. Re-enable once the fork LFS objects are restored.
          lfs: false

      - name: Validate submodules
        run: python3 scripts/license/collect_license_inputs.py validate-submodules

      - name: Prepare third-party ScanCode input
        run: python3 scripts/license/collect_license_inputs.py thirdparty-focused

      - name: Install ScanCode.io wrapper with VulnerableCode settings
        run: python3 scripts/license/install_scanpipe_wrapper.py

      - name: Run ScanCode third-party focused scan
        uses: aboutcode-org/scancode-action@v0.1
        with:
          pipelines: scan_codebase,find_vulnerabilities
          inputs-path: scancode-thirdparty-inputs
          project-name: openvino-contrib-thirdparty
          outputs-archive-name: scancode-thirdparty
          output-formats: json xlsx spdx cyclonedx
          check-compliance: "true"
          compliance-fail-level: MISSING
          compliance-fail-on-vulnerabilities: "true"

      - name: Upload third-party ScanCode outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scancode-thirdparty-outputs
          path: |
            .scancodeio/**/output/*
            scancode-thirdparty-inputs/policies.yml
            scancode-thirdparty-inputs/vendored-roots.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize third-party ScanCode report
        if: always()
        run: python3 scripts/license/print_scancode_summary.py --search-root .scancodeio --title "ScanCode third-party focused report" --artifact-name "scancode-thirdparty-outputs" --strict-thirdparty --require-report
